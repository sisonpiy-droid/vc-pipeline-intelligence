<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VC Pipeline Intelligence · Components Map</title>
<style>
  :root { --navy: #1f3556; --line: #c9d1de; --ink: #1c2b44; }
  * { box-sizing: border-box; margin: 0; }
  body { background: #f6f4ef; color: var(--ink); font-family: "Segoe UI", Verdana, system-ui, sans-serif; }
  .page { width: 2000px; padding: 44px 44px 48px; }
  h1 { font-size: 52px; font-weight: 800; letter-spacing: -0.5px; color: #1b2f55; }
  .sub { margin-top: 10px; font-size: 24px; color: #7a8294; }
  #grid { position: relative; margin-top: 30px; display: grid; grid-template-columns: 255px repeat(6, 1fr); border: 2px solid var(--navy); background: #fff; }
  .hd { background: var(--navy); color: #fff; font-weight: 800; font-size: 25px; text-align: center; padding: 26px 8px; border-right: 1px solid #38507a; }
  .lab { background: var(--navy); color: #fff; text-align: center; padding: 14px 10px; display: flex; flex-direction: column; justify-content: center; border-top: 1px solid #38507a; }
  .lab b { font-size: 22px; font-weight: 800; }
  .lab span { font-size: 17px; color: #d3dcec; margin-top: 3px; }
  .cell { border-top: 1px solid #dfe3ec; border-right: 1px solid #dfe3ec; position: relative; min-height: 128px; padding: 10px 56px 10px 14px; display: flex; align-items: center; }
  .cell.z0 { background: #fdfdf8; } .cell.z1 { background: #f3f4f9; }
  .box { width: 100%; border: 2px solid; border-radius: 12px; padding: 11px 12px; text-align: center; font-weight: 700; font-size: 19px; line-height: 1.22; position: relative; z-index: 3; }
  .c-blue { background: #dce9fb; border-color: #86a9de; }
  .c-yellow { background: #fbe8a8; border-color: #e1c15b; }
  .c-green { background: #d2e9d2; border-color: #86bb86; }
  .c-pink { background: #f5d0de; border-color: #de8fae; }
  .c-orange { background: #f4cb9c; border-color: #e0a05a; }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; overflow: visible; }
  .note { margin-top: 26px; background: #f7e7b5; border: 2px solid #e1c15b; border-radius: 18px; padding: 24px 30px; text-align: center; font-weight: 700; font-size: 24px; color: #2a3550; }
</style>
</head>
<body>
<div class="page">
  <h1>VC Pipeline Intelligence · Components Map</h1>
  <p class="sub">A founder's week: trigger → collect → judge → decide → store → deliver</p>
  <div id="grid"></div>
  <p class="note">Gemini only reads evidence and writes words. Fixed rules in code decide every score. A refresh writes only 4 columns. You press send.</p>
</div>

<script>
const COLS = ["Actor", "Trigger", "Collect", "AI", "Decision", "Store", "Output"];
const ROWS = [
  ["You", "(Founder)"], ["Vercel Cron", "(2 jobs)"], ["Tavily", "(Web search)"], ["Firm feeds", "(RSS / Atom)"], ["VC news", "(7 feeds)"],
  ["Gemini Flash", "(AI)"], ["Rules", "(Code, no AI)"], ["Startups", "(Own rubric)"], ["Supabase", "(Database)"], ["Contacts", "(Private lists)"],
  ["Telegram", "(Daily alert)"], ["Web app", "(Vercel)"], ["Your mail app", "(Drafts)"],
];
// col: 1 Trigger, 2 Collect, 3 AI, 4 Decision, 5 Store, 6 Output
const BOX = [
  { id: "you", r: 0, c: 1, k: "blue", t: "Opens the app, edits notes, taps Refresh now" },
  { id: "cron", r: 1, c: 1, k: "yellow", t: "Mon + Thu 09:30 IST refresh, daily 11:00 IST report" },
  { id: "tav", r: 2, c: 2, k: "blue", t: "Searches the last 30 days and reads each page's own date" },
  { id: "feeds", r: 3, c: 2, k: "blue", t: "Firms' own RSS and Atom feeds, no search credits" },
  { id: "news", r: 4, c: 2, k: "blue", t: "7 VC news feeds, read when you open the page" },
  { id: "gem", r: 5, c: 3, k: "pink", t: "Checks the page names the investor, judges relevance, writes the opening line. Backup: same model via OpenRouter" },
  { id: "rules", r: 6, c: 4, k: "yellow", t: "Scores 0 to 100, picks the action. A failed search never counts as quiet" },
  { id: "start", r: 7, c: 4, k: "yellow", t: "Each startup gets its own rubric and scores from the same evidence" },
  { id: "db", r: 8, c: 5, k: "green", t: "Investors, evidence, runs, audit. A refresh writes only 4 columns" },
  { id: "con", r: 9, c: 5, k: "green", t: "Locked table. Only aggregate counts are ever shown" },
  { id: "tg", r: 10, c: 6, k: "orange", t: "Daily report: who to email first, follow-ups due, who not to chase" },
  { id: "web", r: 11, c: 6, k: "orange", t: "Queue, board, brief, signals, what-if, news, chat, demo video" },
  { id: "mail", r: 12, c: 6, k: "orange", t: "Draft with your pitch and Calendly link. You press send" },
];
const EDGES = [["you", "db"], ["cron", "tav"], ["cron", "feeds"], ["tav", "gem"], ["feeds", "gem"], ["news", "web"], ["gem", "rules"], ["gem", "start"], ["rules", "db"], ["start", "db"], ["db", "tg"], ["db", "web"], ["db", "mail"], ["con", "web"]];

const grid = document.getElementById("grid");
COLS.forEach((c) => { const d = document.createElement("div"); d.className = "hd"; d.textContent = c; grid.appendChild(d); });
ROWS.forEach(([a, s], r) => {
  const l = document.createElement("div"); l.className = "lab"; l.innerHTML = `<b>${a}</b><span>${s}</span>`; grid.appendChild(l);
  for (let c = 1; c <= 6; c++) {
    const cell = document.createElement("div"); cell.className = `cell z${r % 2}`;
    const b = BOX.find((x) => x.r === r && x.c === c);
    if (b) { const e = document.createElement("div"); e.className = `box c-${b.k}`; e.id = b.id; e.textContent = b.t; cell.appendChild(e); }
    grid.appendChild(cell);
  }
});

// Dashed elbow arrows: out of the source's right edge, down a lane in its right-hand gutter, into the target's left edge.
const NS = "http://www.w3.org/2000/svg";
const svg = document.createElementNS(NS, "svg");
svg.innerHTML = `<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#667085"/></marker></defs>`;
grid.appendChild(svg);
requestAnimationFrame(() => {
  const g = grid.getBoundingClientRect();
  const pos = (id) => { const r = document.getElementById(id).getBoundingClientRect(); return { l: r.left - g.left, r: r.right - g.left, y: (r.top + r.bottom) / 2 - g.top }; };
  const perCol = {}, laneOf = {}; // one lane per source (edges from the same box share a trunk); sources in the same column get side-by-side lanes
  EDGES.forEach(([a, b]) => {
    const s = pos(a), t = pos(b);
    if (laneOf[a] === undefined) { const k = Math.round(s.r); laneOf[a] = perCol[k] = (perCol[k] ?? -1) + 1; }
    const x = s.r + 10 + laneOf[a] * 8;
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", `M${s.r} ${s.y} H${x} V${t.y} H${t.l - 1}`);
    p.setAttribute("fill", "none"); p.setAttribute("stroke", "#667085"); p.setAttribute("stroke-width", "2.6"); p.setAttribute("stroke-dasharray", "7 5"); p.setAttribute("marker-end", "url(#ah)");
    svg.appendChild(p);
  });
  window.DONE = true;
});
</script>
</body>
</html>
